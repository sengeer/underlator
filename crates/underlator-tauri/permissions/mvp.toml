# Разрешения ACL для MVP Tauri commands (атом 5.1 / 5.2).
# Без этих файлов capabilities/default.json не резолвит allow-* идентификаторы.

[[permission]]
identifier = "allow-model-generate"
description = "Разрешает invoke model_generate"
commands.allow = ["model_generate"]

[[permission]]
identifier = "allow-model-stop"
description = "Разрешает invoke model_stop"
commands.allow = ["model_stop"]

