[package]
name = "underlator-tauri"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Тонкий desktop-host Underlator (Tauri 2) над underlator-core"

[lib]
name = "underlator_tauri"
path = "src/lib.rs"

[[bin]]
name = "underlator-tauri"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
underlator-core.workspace = true
tauri = { version = "2", optional = true , features = [] }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dev-dependencies]
async-trait = "0.1"
futures-util.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[features]
default = []
# Включайте при наличии native-зависимостей Tauri 2 (GTK/WebKit на Linux):
#   cargo check -p underlator-tauri --features desktop
desktop = ["dep:tauri", "dep:tauri-build"]
