schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: Underlator — confidential local-LLM translator/assistant.
  Migration: Electron backend → Rust core + Tauri 2 (desktop) + Axum server (docker).
  One react-app for both modes. No separate git repos for backend.
  Architecture plan: .cursor/docs/ARCHITECTURAL_PLAN_TAURI_RUST_DUAL_MODE_V1.md
  MVP API surface: model + catalog + chat from electron-app/src/preload.ts (RAG later).
  Strict code rules: minimal big-O cost; SOLID; testable/maintainable/extensible; rustdoc in Russian.
  Core MUST NOT depend on tauri/axum. Hosts are thin driving adapters only.

  Atom 2.4 is done: underlator-core uses strict hexagonal layers —
  domain / ports / application / adapters/out; lib.rs is composition root.
  New core code MUST go only into those hex layers (not flat src/ modules).
  Layer lint: arch-lint (in-crate, cargo test -p underlator-core) is the gate;
  rustqual Architecture is optional backup; clippy is the quality companion;
  hex-lint only if core is later split into multiple crates.
  Atoms 3.x+ MUST place new code only in hex layers; server/tauri = inbound/driving adapters.
  DoD for post-2.4 Rust changes MUST run the architecture linter + cargo test -p underlator-core.
