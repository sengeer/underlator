# Dual-mode (Docker): Axum-сервер + sidecar Ollama.
# Данные приложения: named volume `/data` (`StorageRoot` чатов).

services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      # SPA Bearer = server secret (default Dockerfile тоже `dev-change-me`).
      args:
        VITE_BACKEND_TOKEN: ${UNDERLATOR_AUTH_TOKEN:-dev-change-me}
        VITE_BACKEND_MODE: http
    ports:
      - "8080:8080"
    environment:
      UNDERLATOR_DATA_DIR: /data
      UNDERLATOR_BIND: 0.0.0.0:8080
      UNDERLATOR_STATIC_DIR: /app/static
      OLLAMA_BASE_URL: http://ollama:11434
      # Dev-default shared secret. Смените перед публичным продом:
      # без token процесс с bind 0.0.0.0 не стартует (fail-closed).
      UNDERLATOR_AUTH_TOKEN: ${UNDERLATOR_AUTH_TOKEN:-dev-change-me}
    volumes:
      - underlator-data:/data
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    # Порт sidecar только во внутренней сети compose (`OLLAMA_BASE_URL=http://ollama:11434`).
    # Не публикуем :11434 на host — часто занят локальным Ollama; для отладки: podman exec.
    volumes:
      - ollama-data:/root/.ollama

volumes:
  underlator-data:
  ollama-data:
